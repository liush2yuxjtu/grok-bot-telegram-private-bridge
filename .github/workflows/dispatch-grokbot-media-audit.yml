name: Independently verify Grokbot GIF animation

on:
  push:
    branches:
      - ops/grokbot-media-audit-20260920

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify GIF frames with Pillow
        env:
          GIF_URL: https://grokbot.tail6a877d.ts.net/media/2e0293cd5e6c460b86e83e31c697ba70/pelican-bike-dashcam.gif
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'Pillow==11.3.0'
          curl --fail --silent --show-error --location --max-time 30 -o /tmp/media.gif "$GIF_URL"
          python3 - <<'PY'
          from PIL import Image
          import hashlib
          im=Image.open('/tmp/media.gif')
          n=im.n_frames
          durations=[]
          hashes=[]
          for i in range(n):
              im.seek(i)
              durations.append(int(im.info.get('duration',0)))
              if i in (0,1):
                  hashes.append(hashlib.sha256(im.convert('RGB').tobytes()).hexdigest())
          print('frames=',n)
          print('size=',im.size)
          print('loop=',im.info.get('loop'))
          print('duration_ms=',sum(durations))
          print('frame0_sha256=',hashes[0])
          print('frame1_sha256=',hashes[1])
          assert n == 24
          assert im.size == (720,405)
          assert im.info.get('loop') == 0
          assert 1900 <= sum(durations) <= 2100
          assert hashes[0] != hashes[1]
          PY
