name: Independently count Grokbot GIF frames

on:
  push:
    branches:
      - ops/grokbot-media-audit-20260920

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Count actual GIF frames independently
        env:
          GIF_URL: https://grokbot.tail6a877d.ts.net/media/2e0293cd5e6c460b86e83e31c697ba70/pelican-bike-dashcam.gif
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 -o /tmp/media.gif "$GIF_URL"
          if command -v identify >/dev/null 2>&1; then
            echo "identify_frames=$(identify /tmp/media.gif | wc -l)"
            identify /tmp/media.gif | head -3
          fi
          if command -v ffprobe >/dev/null 2>&1; then
            ffprobe -v error -count_frames -select_streams v:0               -show_entries stream=width,height,nb_read_frames,avg_frame_rate,duration               -of default=noprint_wrappers=1 /tmp/media.gif
          fi
          python3 - <<'PY'
          try:
              from PIL import Image
          except ImportError:
              print("pillow=not_preinstalled")
          else:
              im=Image.open('/tmp/media.gif')
              print(f'pillow_frames={getattr(im,"n_frames",1)} size={im.size} loop={im.info.get("loop")} duration0={im.info.get("duration")}')
          PY
