name: Compatibility report
description: Report a reproducible break after a Grok Bot or bridge change
title: "[compat]: "
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Never include Telegram tokens, gateway tokens, pairing codes, chat IDs, user IDs, agent IDs, usernames, personal paths, screenshots with credentials, or message text. Revoke any exposed token before continuing.
  - type: input
    id: grok-version
    attributes:
      label: Grok Bot version
      placeholder: "Example: 1.2.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "Output of node --version"
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: First failing boundary
      options:
        - startup
        - pairing
        - Telegram polling
        - gateway prompt submission
        - final reply extraction
        - Telegram reply delivery
        - supervisor restart
        - unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use harmless test messages and redacted paths.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Shortest redacted error
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed all credentials, IDs, personal paths, and message content.
          required: true
        - label: I ran `npm test` and `npm run check`, or explained why they could not run.
          required: true
